plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
base { archivesName = project.archives_base_name }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir 'src/main/generated' }

neoForge {
    version = project.neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/main/generated/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: project.mod_version }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': 'yh',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'yh',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': 'adachirei_nui.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
